name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK components
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" 2>/dev/null || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        id: build
        run: ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        continue-on-error: true

      - name: Commit errors for inspection
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p ci-debug
          { grep -E "error:|FAILED|unresolved|Cannot|cannot" build.log | head -40; echo "===TAIL==="; tail -50 build.log; } > ci-debug/errors.txt
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions CI"
          git add ci-debug/errors.txt
          git diff --cached --quiet || git commit -m "ci: save build errors [skip ci]"
          git push origin HEAD:main
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OzerLi-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "עוזר לי v1.0.${{ github.run_number }}"
          body: |
            ## עוזר לי 🤝 — מנהל בקשות עזרה אישי

            אפליקציה מודרנית ו-100% אופליין לניהול כל מי שפנה אליך לעזרה.

            ### ✨ פיצ'רים
            - ✅ רשימת בקשות עם דרגות דחיפות
            - 📋 שדה שיעור אופציונלי
            - 🔔 תזכורות חכמות
            - 📊 סטטיסטיקות ודירוג פונים
            - 🕓 היסטוריה מלאה

            ### 📲 התקנה
            1. הורד את ה-APK
            2. הגדרות ← אפליקציות ← מקורות לא ידועים
            3. פתח והתקן

          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
