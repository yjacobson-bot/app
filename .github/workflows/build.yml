name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK components
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" 2>/dev/null || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        id: build
        run: ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        continue-on-error: true

      - name: Post errors as commit comment
        if: steps.build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERRORS=$(grep -E "^e:.*error:|error:.*unresolved|error:.*not found|error:.*cannot|FAILED|Execution failed" build.log | head -30 || echo "No specific errors found")
          LAST_LINES=$(tail -50 build.log)
          BODY="## ❌ Build failed\n\n\`\`\`\n${ERRORS}\n\`\`\`\n\n### Last 50 lines:\n\`\`\`\n${LAST_LINES}\n\`\`\`"
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/yjacobson-bot/app/commits/${{ github.sha }}/comments" \
            -d "{\"body\": $(echo "$BODY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}"
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OzerLi-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "עוזר לי v1.0.${{ github.run_number }}"
          body: |
            ## עוזר לי 🤝 — מנהל בקשות עזרה אישי

            אפליקציה מודרנית ו-100% אופליין לניהול כל מי שפנה אליך לעזרה.

            ### ✨ פיצ'רים
            - ✅ רשימת בקשות עם דרגות דחיפות
            - 📋 שדה שיעור אופציונלי
            - 🔔 תזכורות חכמות
            - 📊 סטטיסטיקות ודירוג פונים
            - 🕓 היסטוריה מלאה

            ### 📲 התקנה
            1. הורד את ה-APK
            2. הגדרות ← אפליקציות ← מקורות לא ידועים
            3. פתח והתקן

          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
