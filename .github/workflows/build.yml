name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OzerLi-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "עוזר לי v1.0.${{ github.run_number }}"
          body: |
            ## עוזר לי 🤝 — מנהל בקשות עזרה אישי

            אפליקציה אופליין לניהול כל מי שפנה אליך לעזרה.

            ### ✨ פיצ'רים
            - רשימת בקשות פתוחות עם דחיפות (אדום / צהוב / ירוק)
            - שדה שיעור אופציונלי לכל בקשה
            - תזכורות חכמות
            - היסטוריה וסטטיסטיקות

            ### 📲 התקנה
            1. הורד את ה-APK למטה
            2. הגדרות ← אפליקציות ← מקורות לא ידועים ← אפשר
            3. פתח את הקובץ ← התקן

          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
